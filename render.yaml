services:
  # Backend Web Service
  - type: web
    name: financewise-server
    env: node
    rootDir: server
    buildCommand: npm install && npm run build && npm run migrate:up
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set this value manually in the Render Dashboard (Supabase connection string)
      - key: JWT_SECRET
        sync: false # Set manually in the Render Dashboard — long random string, e.g. `openssl rand -hex 32`
      - key: AUTH_PASSWORD_HASH
        sync: false # Set manually in the Render Dashboard — a bcrypt hash of your login password (do not use plaintext AUTH_PASSWORD in production)
      - key: CLIENT_ORIGIN
        value: "https://financewise-client.onrender.com" # Update to match the actual deployed client URL

  # Frontend Static Site
  - type: web
    name: financewise-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: "https://finance-tracker-m7l4.onrender.com/api" # Must include /api — the client appends route paths like /transactions directly
