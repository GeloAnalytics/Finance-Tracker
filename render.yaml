services:
  # Backend Web Service
  - type: web
    name: financewise-server
    runtime: node
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build && npm run migrate:up
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set this value manually in the Render Dashboard (Supabase connection string)
      - key: JWT_SECRET
        sync: false # Set manually in the Render Dashboard — long random string, e.g. `openssl rand -hex 32`
      - key: ADMIN_EMAIL
        sync: false # Developer/support email used to bootstrap the admin account
      - key: ADMIN_USERNAME
        sync: false # Developer/support username
      - key: ADMIN_PASSWORD_HASH
        sync: false # Set manually in the Render Dashboard — a bcrypt hash of your login password (do not use plaintext AUTH_PASSWORD in production)
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: financewise-client
          envVarKey: RENDER_EXTERNAL_URL

  # Frontend Static Site
  - type: web
    name: financewise-client
    runtime: static
    rootDir: client
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          type: web
          name: financewise-server
          envVarKey: RENDER_EXTERNAL_URL
